<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="../icons/icon48.png" alt="" width="28" height="28">
    <div class="title">
      <h1>Clawd for Meet</h1>
      <span id="pill" class="pill">…</span>
    </div>
  </header>

  <section class="card row">
    <div>
      <h2>Вместо меня — Clawd</h2>
      <p>Следит за головой, моргает и говорит твоим ртом</p>
    </div>
    <label class="switch">
      <input id="mascot" type="checkbox" checked>
      <span></span>
    </label>
  </section>

  <section class="card">
    <div class="card-head">
      <h2>Пустая комната</h2>
    </div>
    <div class="room">
      <div id="preview" class="preview"><span>нет снимка</span></div>
      <p id="roomText"></p>
    </div>
    <button id="capture" class="secondary wide">Снять комнату</button>
  </section>

  <footer>
    <span>Всё обрабатывается локально</span>
    <span><kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>X</kbd></span>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
